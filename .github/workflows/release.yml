name: release

# Pushing a tag like v0.1.0 builds and tests everything, then publishes:
#   - a GitHub release with epaperclip.tar.gz, its checksum, the signed manifest and signature, the signed worker release
#     (epaperclip-worker-<version>.tar.gz and its manifest and signature), get.sh and the .deb
#   - the signed APT repository at apt.papercliped.co, when its signing key and R2 upload credentials are configured
#   - the epaperclip npm package, over npm Trusted Publishing (OIDC, no token); a failure there never fails the release
# A tag needs the RELEASE_SIGNING_KEY secret (see docs/RELEASING.md): without it the build FAILS, so nothing unsigned is ever
# published. A tag with a hyphen (v1.0.0-rc1) is a release candidate: a GitHub pre-release, npm dist-tag "next", no APT update.
# Running it by hand (workflow_dispatch) builds and tests without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      republish_tag:
        description: "An existing release tag (for example v1.0.0): re-run ONLY the npm, update feed and APT steps for it, from that release's own signed assets. Leave empty to build and test without publishing."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.republish_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Proxmox API conformance (every call against Proxmox's own schema)
        run: node scripts/check-pve-api.mjs
      - name: Release script tests (key generator, signer, get.sh build)
        run: node --test scripts/release-signing.test.mjs scripts/update-feed.test.mjs scripts/release-notes.test.mjs
      - name: Proxmox sandbox provider (tests, then the build the release ships)
        run: |
          npm --prefix plugins/proxmox-sandbox ci
          npm --prefix plugins/proxmox-sandbox run typecheck
          npm --prefix plugins/proxmox-sandbox test
          npm --prefix plugins/proxmox-sandbox run build
          npm --prefix plugins/remote-worker ci
          npm --prefix plugins/remote-worker run typecheck
          npm --prefix plugins/remote-worker test
          npm --prefix plugins/remote-worker run build
      - name: Require the signing key for a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set, so this tag cannot be released. Run scripts/release-keygen.mjs once (docs/RELEASING.md)."; exit 1; }
          [ -f deploy/release-signing.pub ] || { echo "::error::deploy/release-signing.pub is not committed. Run scripts/release-keygen.mjs once (docs/RELEASING.md)."; exit 1; }
      - run: node scripts/package-release.mjs "${GITHUB_REF_NAME}"
        env:
          EPC_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Sign the release (Ed25519 over the manifest; the build fails if it can't)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          EPC_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/sign-release.mjs
      - name: Build the worker release (deterministic; the same bytes for the same commit)
        run: bash scripts/package-worker.sh release
      - name: Sign the worker release (same Ed25519 key, its own manifest; the build fails if it can't)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-worker-release.mjs
      - name: Build the Debian package
        run: bash scripts/build-deb.sh
      - name: Installer tests (simulated Proxmox hosts, the .deb, the npm command)
        run: sudo env "PATH=$PATH" bash deploy/test/run.sh
      - name: Engine install from engine/package-lock.json (real npm ci, runs as nobody)
        run: sudo env "PATH=$PATH" EPC_TEST_REAL_ENGINE=1 bash deploy/test/run.sh real_engine
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes come from CHANGELOG.md or the commit messages since the last release (scripts/release-notes.mjs); GitHub's own
          # generated notes (a bare compare link, since our commits aren't pull requests) are only the fallback.
          if node scripts/release-notes.mjs --tag "${GITHUB_REF_NAME}" --out release/notes.md; then flags=(--notes-file release/notes.md); else flags=(--generate-notes); fi
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" release/epaperclip.tar.gz release/epaperclip.tar.gz.sha256 release/epaperclip.manifest.json release/epaperclip.manifest.sig release/epaperclip-worker-*.tar.gz release/epaperclip-worker.manifest.json release/epaperclip-worker.manifest.sig release/get.sh release/epaperclip_*_all.deb --title "${GITHUB_REF_NAME}" "${flags[@]}"
      - name: Publish the npm package (Trusted Publishing; the GitHub release above is the artifact, so this never fails the run)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        working-directory: npm/epaperclip
        run: |
          npm install -g npm@^11.5.1
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          tag=latest; case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag"
      - name: Publish the signed update feed (what installed devices read to find updates)
        if: startsWith(github.ref, 'refs/tags/')
        # A failure here never fails the release: devices fall back to GitHub's own release list.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'epaperclip-releases' }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_R2_ENDPOINT; do
            [ -n "${!name}" ] || { echo "::notice::Update feed was not published: ${name} is not configured."; exit 0; }
          done
          feed="$(mktemp -d)"
          trap 'rm -rf "$feed"' EXIT
          bash scripts/publish-update-feed.sh --local "$feed"
          aws s3 sync "$feed/" "s3://${CLOUDFLARE_R2_BUCKET}/" --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --no-progress
      - name: Publish the APT repository to Cloudflare R2 (stable releases only)
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'epaperclip-releases' }}
        run: |
          for name in APT_SIGNING_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_R2_ENDPOINT; do
            [ -n "${!name}" ] || { echo "::notice::APT repository was not published: ${name} is not configured."; exit 0; }
          done
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev >/dev/null; }
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          aws s3 sync "s3://${CLOUDFLARE_R2_BUCKET}/" "$repo/" --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --no-progress
          bash scripts/publish-apt.sh --local "$repo"
          aws s3 sync "$repo/" "s3://${CLOUDFLARE_R2_BUCKET}/" --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --no-progress

  # Re-runs only the publish steps for a tag that already has a GitHub release, from that release's own signed assets, when one of
  # them failed after the release was created (a re-run of the release job can't: it would try to create the release again).
  # npm Trusted Publishing is bound to this workflow file, so this is where it has to live. Dispatch it from main with the tag.
  republish:
    if: github.event_name == 'workflow_dispatch' && inputs.republish_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Only an existing release tag
        env:
          TAG: ${{ inputs.republish_tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::republish_tag must be a release tag like v1.0.0"; exit 1 ;; esac
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.republish_tag }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Fetch that release's own assets (the signed files the npm package and the APT repository are made from)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.republish_tag }}
        run: |
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          ls -l release
      - name: Publish the npm package (Trusted Publishing; the GitHub release above is the artifact, so this never fails the run)
        continue-on-error: true
        working-directory: npm/epaperclip
        env:
          TAG: ${{ inputs.republish_tag }}
        run: |
          npm install -g npm@^11.5.1
          npm version "${TAG#v}" --no-git-tag-version
          tag=latest; case "${TAG}" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag"
      - name: Publish the signed update feed (what installed devices read to find updates)
        # A failure here never fails the release: devices fall back to GitHub's own release list.
        continue-on-error: true
        env:
          TAG: ${{ inputs.republish_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'epaperclip-releases' }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_R2_ENDPOINT; do
            [ -n "${!name}" ] || { echo "::notice::Update feed was not published: ${name} is not configured."; exit 0; }
          done
          feed="$(mktemp -d)"
          trap 'rm -rf "$feed"' EXIT
          bash scripts/publish-update-feed.sh --local "$feed"
          aws s3 sync "$feed/" "s3://${CLOUDFLARE_R2_BUCKET}/" --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --no-progress
      - name: Take the APT public key from main (the tag may predate a key change; the script refuses a key that isn't the published one)
        if: ${{ !contains(inputs.republish_tag, '-') }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout
          sparse-checkout: deploy/apt
      - name: Publish the APT repository to Cloudflare R2 (stable releases only)
        if: ${{ !contains(inputs.republish_tag, '-') }}
        env:
          EPC_APT_PUBLIC_KEY: ${{ github.workspace }}/main-checkout/deploy/apt/epaperclip-archive-keyring.asc
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'epaperclip-releases' }}
        run: |
          for name in APT_SIGNING_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_R2_ENDPOINT; do
            [ -n "${!name}" ] || { echo "::notice::APT repository was not published: ${name} is not configured."; exit 0; }
          done
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev >/dev/null; }
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          aws s3 sync "s3://${CLOUDFLARE_R2_BUCKET}/" "$repo/" --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --no-progress
          bash scripts/publish-apt.sh --local "$repo"
          aws s3 sync "$repo/" "s3://${CLOUDFLARE_R2_BUCKET}/" --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --no-progress
