name: release

# Pushing a tag like v0.1.0 builds and tests everything, then publishes:
#   - a GitHub release with epaperclip.tar.gz, its checksum, the signed manifest and signature, get.sh and the .deb
#   - the signed APT repository on GitHub Pages (gh-pages branch, apt/), when the APT_SIGNING_KEY secret is set
#   - the epaperclip npm package, over npm Trusted Publishing (OIDC, no token); a failure there never fails the release
# A tag needs the RELEASE_SIGNING_KEY secret (see docs/RELEASING.md): without it the build FAILS, so nothing unsigned is ever
# published. A tag with a hyphen (v1.0.0-rc1) is a release candidate: a GitHub pre-release, npm dist-tag "next", no APT update.
# Running it by hand (workflow_dispatch) builds and tests without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Proxmox API conformance (every call against Proxmox's own schema)
        run: node scripts/check-pve-api.mjs
      - name: Release script tests (key generator, signer, get.sh build)
        run: node --test scripts/release-signing.test.mjs scripts/update-feed.test.mjs
      - name: Proxmox sandbox provider (tests, then the build the release ships)
        run: |
          npm --prefix plugins/proxmox-sandbox ci
          npm --prefix plugins/proxmox-sandbox run typecheck
          npm --prefix plugins/proxmox-sandbox test
          npm --prefix plugins/proxmox-sandbox run build
      - name: Require the signing key for a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set, so this tag cannot be released. Run scripts/release-keygen.mjs once (docs/RELEASING.md)."; exit 1; }
          [ -f deploy/release-signing.pub ] || { echo "::error::deploy/release-signing.pub is not committed. Run scripts/release-keygen.mjs once (docs/RELEASING.md)."; exit 1; }
      - run: node scripts/package-release.mjs "${GITHUB_REF_NAME}"
        env:
          EPC_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Sign the release (Ed25519 over the manifest; the build fails if it can't)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          EPC_RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/sign-release.mjs
      - name: Build the Debian package
        run: bash scripts/build-deb.sh
      - name: Installer tests (simulated Proxmox hosts, the .deb, the npm command)
        run: sudo env "PATH=$PATH" bash deploy/test/run.sh
      - name: Engine install from engine/package-lock.json (real npm ci, runs as nobody)
        run: sudo env "PATH=$PATH" EPC_TEST_REAL_ENGINE=1 bash deploy/test/run.sh real_engine
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes)
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" release/epaperclip.tar.gz release/epaperclip.tar.gz.sha256 release/epaperclip.manifest.json release/epaperclip.manifest.sig release/get.sh release/epaperclip_*_all.deb --title "${GITHUB_REF_NAME}" "${flags[@]}"
      - name: Publish the APT repository (stable releases only)
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev >/dev/null; }
          bash scripts/publish-apt.sh
      - name: Publish the signed update feed (what installed devices read to find updates)
        if: startsWith(github.ref, 'refs/tags/')
        # A failure here never fails the release: devices fall back to GitHub's own release list.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash scripts/publish-update-feed.sh
      - name: Publish the npm package (Trusted Publishing; the GitHub release above is the artifact, so this never fails the run)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        working-directory: npm/epaperclip
        run: |
          npm install -g npm@^11.5.1
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          tag=latest; case "${GITHUB_REF_NAME}" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag"
