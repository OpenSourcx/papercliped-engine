name: release

# Pushing a tag like v0.1.0 builds and tests everything, then publishes:
#   - a GitHub release with epaperclip.tar.gz, its checksum, get.sh and the .deb
#   - the signed APT repository on GitHub Pages (gh-pages branch, apt/), when the APT_SIGNING_KEY secret is set
#   - the epaperclip npm package, when the NPM_TOKEN secret is set
# Running it by hand (workflow_dispatch) builds and tests without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/package-release.mjs "${GITHUB_REF_NAME}"
      - name: Build the Debian package
        run: bash scripts/build-deb.sh
      - name: Installer tests (simulated Proxmox hosts, the .deb, the npm command)
        run: sudo env "PATH=$PATH" bash deploy/test/run.sh
      - name: Engine install from engine/package-lock.json (real npm ci, runs as nobody)
        run: sudo env "PATH=$PATH" EPC_TEST_REAL_ENGINE=1 bash deploy/test/run.sh real_engine
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/epaperclip.tar.gz release/epaperclip.tar.gz.sha256 release/get.sh release/epaperclip_*_all.deb --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Publish the APT repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev >/dev/null; }
          bash scripts/publish-apt.sh
      - name: Publish the npm package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: npm/epaperclip
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::NPM_TOKEN isn't set, so the npm package was not published."; exit 0; fi
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public --provenance
