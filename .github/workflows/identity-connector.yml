name: Papercliped account connector checks
on:
  push:
    branches: [feat/unified-papercliped-account-connector]
  pull_request:
    paths:
      - "services/epaperclip/src/paperclipedAccount.ts"
      - "services/epaperclip/test/papercliped-account.test.ts"
      - "docs/PAPERCLIPED-ACCOUNT.md"
      - ".github/workflows/identity-connector.yml"
permissions:
  contents: read
jobs:
  device-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @papercliped-engine/epaperclip typecheck
      - run: pnpm --filter @papercliped-engine/epaperclip exec vitest run test/papercliped-account.test.ts
